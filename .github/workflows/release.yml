name: signed-release-smoke

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-release-smoke:
    runs-on: windows-latest
    env:
      CI: true
      WECHATVOICE_SIGNED_RELEASE: true
      # Keep the allowed publisher anchors independent from the generated
      # update manifest and the package itself.
      WECHATVOICE_ALLOWED_PUBLISHERS_JSON: ${{ secrets.WECHATVOICE_ALLOWED_PUBLISHERS_JSON }}
      WECHATVOICE_ALLOWED_PUBLISHER_THUMBPRINT: ${{ secrets.WECHATVOICE_ALLOWED_PUBLISHER_THUMBPRINT }}
      WECHATVOICE_ALLOWED_PUBLISHER_KEY_ID: ${{ secrets.WECHATVOICE_ALLOWED_PUBLISHER_KEY_ID }}
      WECHATVOICE_ALLOWED_PACKAGE_PUBLISHER: ${{ secrets.WECHATVOICE_ALLOWED_PACKAGE_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore locked
        run: dotnet restore WeChatVoice.slnx --locked-mode --runtime win-x64
      - name: Build and test
        run: dotnet test WeChatVoice.slnx --configuration Release --no-restore /m:1
      - name: Materialize signing certificate
        shell: pwsh
        env:
          WECHATVOICE_SIGNING_PFX_BASE64: ${{ secrets.WECHATVOICE_SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WECHATVOICE_SIGNING_PFX_BASE64)) {
            throw 'WECHATVOICE_SIGNING_PFX_BASE64 is not configured.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'wechatvoice-release-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WECHATVOICE_SIGNING_PFX_BASE64))
          "WECHATVOICE_SIGNING_PFX_PATH=$pfxPath" >> $env:GITHUB_ENV
      - name: Publish, sign, manifest, and protected-directory trust smoke
        shell: pwsh
        env:
          WECHATVOICE_SIGNING_PFX_PASSWORD: ${{ secrets.WECHATVOICE_SIGNING_PFX_PASSWORD }}
        run: ./scripts/package-release.ps1 -PfxPath "$env:WECHATVOICE_SIGNING_PFX_PATH" -PfxPassword "$env:WECHATVOICE_SIGNING_PFX_PASSWORD" -RequireSignature -ReleaseTrustSmoke -OutputDirectory "$env:GITHUB_WORKSPACE\\artifacts\\package"
      - name: Build and sign formal MSIX installer
        shell: pwsh
        env:
          WECHATVOICE_SIGNING_PFX_PASSWORD: ${{ secrets.WECHATVOICE_SIGNING_PFX_PASSWORD }}
        run: |
          $versionText = $env:GITHUB_REF_NAME -replace '^v', '' -replace '-.*$', ''
          $parts = @($versionText -split '\.' | Where-Object { $_ -match '^\d+$' })
          if ($parts.Count -eq 0) { $parts = @('0', '0', $env:GITHUB_RUN_NUMBER) }
          while ($parts.Count -lt 3) { $parts += '0' }
          $version = "$($parts[0]).$($parts[1]).$($parts[2]).0"
          "WECHATVOICE_PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          ./scripts/package-msix.ps1 -PublishDirectory "$env:GITHUB_WORKSPACE\\artifacts\\package" -OutputPath "$env:GITHUB_WORKSPACE\\artifacts\\WeChatVoiceToolkit-win-x64.msix" -PfxPath "$env:WECHATVOICE_SIGNING_PFX_PATH" -PfxPassword "$env:WECHATVOICE_SIGNING_PFX_PASSWORD" -Version $version
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $env:WECHATVOICE_SIGNING_PFX_PATH,
            $env:WECHATVOICE_SIGNING_PFX_PASSWORD,
            [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
          try {
            . "$env:GITHUB_WORKSPACE\scripts\publisher-fingerprint.ps1"
            $publisherFingerprint = Get-CertificateSha256Fingerprint -Certificate $certificate
            $releaseBase = if ($env:GITHUB_REF_NAME -like 'v*') {
              "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME"
            } else {
              "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download"
            }
            $packageUri = "$releaseBase/WeChatVoiceToolkit-win-x64.msix"
            $appInstallerUri = "$releaseBase/WeChatVoiceToolkit.appinstaller"
            ./scripts/generate-update-manifest.ps1 `
              -PackagePath "$env:GITHUB_WORKSPACE\\artifacts\\WeChatVoiceToolkit-win-x64.msix" `
              -OutputPath "$env:GITHUB_WORKSPACE\\artifacts\\WeChatVoiceToolkit-win-x64.update-manifest.json" `
              -Version $version `
              -PublisherThumbprint $publisherFingerprint `
              -PackageUri $packageUri
            ./scripts/generate-appinstaller.ps1 `
              -PackagePath "$env:GITHUB_WORKSPACE\artifacts\WeChatVoiceToolkit-win-x64.msix" `
              -OutputPath "$env:GITHUB_WORKSPACE\artifacts\WeChatVoiceToolkit.appinstaller" `
              -PackageUri $packageUri `
              -AppInstallerUri $appInstallerUri
            $updateMetadata = Get-Content -LiteralPath "$env:GITHUB_WORKSPACE\\artifacts\\WeChatVoiceToolkit-win-x64.update-manifest.json" -Raw -Encoding UTF8 | ConvertFrom-Json
            . "$env:GITHUB_WORKSPACE\scripts\release-publisher-policy.ps1"
            $publisherPolicy = Get-WeChatVoicePublisherPolicy
            [void](Find-WeChatVoicePublisherAnchor $publisherPolicy $updateMetadata.publisherThumbprint $updateMetadata.publisherKeyId $updateMetadata.publisherId)
          }
          finally { $certificate.Dispose() }
      - name: Install formal MSIX and run ordinary-user trust smoke
        shell: pwsh
        env:
          WECHATVOICE_SIGNING_PFX_PASSWORD: ${{ secrets.WECHATVOICE_SIGNING_PFX_PASSWORD }}
        run: |
          $packagePath = "$env:GITHUB_WORKSPACE\artifacts\WeChatVoiceToolkit-win-x64.msix"
          $updateManifestPath = "$env:GITHUB_WORKSPACE\artifacts\WeChatVoiceToolkit-win-x64.update-manifest.json"
          $publicCertificatePath = Join-Path $env:RUNNER_TEMP 'wechatvoice-release-signing.cer'
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $env:WECHATVOICE_SIGNING_PFX_PATH,
            $env:WECHATVOICE_SIGNING_PFX_PASSWORD,
            [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
          [IO.File]::WriteAllBytes($publicCertificatePath, $certificate.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          Import-Certificate -FilePath $publicCertificatePath -CertStoreLocation Cert:\CurrentUser\TrustedPeople | Out-Null
          # AppX deployment validates the package publisher through the
          # machine trust store, even though Add-AppxPackage runs for the
          # current user. The hosted Windows runner is administrative; clean
          # this exact temporary certificate up in finally below.
          Import-Certificate -FilePath $publicCertificatePath -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $certificateThumbprint = $certificate.Thumbprint
          try {
            $userDataRoot = Join-Path $env:RUNNER_TEMP 'wechatvoice-user-data-retention'
            $userDataState = Join-Path $env:RUNNER_TEMP 'wechatvoice-user-data-retention.json'
            foreach ($directory in @('snapshots', 'workspaces', 'exports', 'LocalApplicationData')) {
              New-Item -ItemType Directory -Path (Join-Path $userDataRoot $directory) -Force | Out-Null
              Set-Content -LiteralPath (Join-Path $userDataRoot $directory 'sentinel.txt') -Value "preserve-$directory" -Encoding UTF8
            }
            ./scripts/assert-user-data-preserved.ps1 -DataRoot $userDataRoot -StatePath $userDataState -Capture
            ./scripts/install-msix.ps1 -PackagePath $packagePath -UpdateManifestPath $updateManifestPath -RunTrustSmoke
            ./scripts/assert-user-data-preserved.ps1 -DataRoot $userDataRoot -StatePath $userDataState

            # Install a lower-version signed package, roll back to it, then
            # reinstall the release. This exercises the same AppX identity,
            # publisher, and protected Broker closure used by upgrades.
            if ([version]$env:WECHATVOICE_PACKAGE_VERSION -gt [version]'0.0.0.0') {
              $rollbackDirectory = "$env:GITHUB_WORKSPACE\artifacts\rollback"
              New-Item -ItemType Directory -Path $rollbackDirectory -Force | Out-Null
              ./scripts/package-msix.ps1 -PublishDirectory "$env:GITHUB_WORKSPACE\artifacts\package" -OutputPath "$rollbackDirectory\WeChatVoiceToolkit-win-x64.msix" -PfxPath "$env:WECHATVOICE_SIGNING_PFX_PATH" -PfxPassword "$env:WECHATVOICE_SIGNING_PFX_PASSWORD" -Version '0.0.0.0'
              $rollbackCertificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($env:WECHATVOICE_SIGNING_PFX_PATH, $env:WECHATVOICE_SIGNING_PFX_PASSWORD, [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
              try {
                . "$env:GITHUB_WORKSPACE\scripts\publisher-fingerprint.ps1"
                $rollbackPublisherThumbprint = Get-CertificateSha256Fingerprint -Certificate $rollbackCertificate
                ./scripts/generate-update-manifest.ps1 -PackagePath "$rollbackDirectory\WeChatVoiceToolkit-win-x64.msix" -OutputPath "$rollbackDirectory\update-manifest.json" -Version '0.0.0.0' -PublisherThumbprint $rollbackPublisherThumbprint -UpdateKind rollback -RollbackFromVersion $env:WECHATVOICE_PACKAGE_VERSION
              }
              finally { $rollbackCertificate.Dispose() }
              ./scripts/rollback-msix.ps1 -PackagePath "$rollbackDirectory\WeChatVoiceToolkit-win-x64.msix" -RunTrustSmoke
              ./scripts/assert-user-data-preserved.ps1 -DataRoot $userDataRoot -StatePath $userDataState
            } else {
              Write-Host 'No lower AppX version exists for rollback smoke at 0.0.0.0.'
            }
            ./scripts/install-msix.ps1 -PackagePath $packagePath -UpdateManifestPath $updateManifestPath -RunTrustSmoke
            ./scripts/assert-user-data-preserved.ps1 -DataRoot $userDataRoot -StatePath $userDataState
          }
          finally {
            ./scripts/uninstall-msix.ps1 -PackageName WeChatVoiceToolkit
            ./scripts/assert-user-data-preserved.ps1 -DataRoot $userDataRoot -StatePath $userDataState
            Remove-Item -LiteralPath "Cert:\CurrentUser\TrustedPeople\$certificateThumbprint" -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath "Cert:\LocalMachine\TrustedPeople\$certificateThumbprint" -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $publicCertificatePath -Force -ErrorAction SilentlyContinue
            $certificate.Dispose()
          }
      - name: Package release
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/package/* -DestinationPath artifacts/WeChatVoiceToolkit-win-x64.zip
          Copy-Item artifacts/package/sbom.spdx.json artifacts/WeChatVoiceToolkit-win-x64.sbom.spdx.json
          Copy-Item artifacts/package/package-manifest.json artifacts/WeChatVoiceToolkit-win-x64.package-manifest.json
          $releaseFiles = @(
            'artifacts/WeChatVoiceToolkit-win-x64.zip',
            'artifacts/WeChatVoiceToolkit-win-x64.msix',
            'artifacts/WeChatVoiceToolkit-win-x64.sbom.spdx.json',
            'artifacts/WeChatVoiceToolkit-win-x64.package-manifest.json',
            'artifacts/WeChatVoiceToolkit-win-x64.update-manifest.json',
            'artifacts/WeChatVoiceToolkit.appinstaller'
          )
          $releaseFiles | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($_))"
          } | Set-Content artifacts/WeChatVoiceToolkit-win-x64.SHA256SUMS.txt
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeChatVoiceToolkit-win-x64
          path: |
            artifacts/WeChatVoiceToolkit-win-x64.zip
            artifacts/WeChatVoiceToolkit-win-x64.msix
            artifacts/WeChatVoiceToolkit-win-x64.SHA256SUMS.txt
            artifacts/WeChatVoiceToolkit-win-x64.sbom.spdx.json
            artifacts/WeChatVoiceToolkit-win-x64.package-manifest.json
            artifacts/WeChatVoiceToolkit-win-x64.update-manifest.json
            artifacts/WeChatVoiceToolkit.appinstaller
      - name: Publish GitHub Release attachments
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/WeChatVoiceToolkit-win-x64.zip
            artifacts/WeChatVoiceToolkit-win-x64.msix
            artifacts/WeChatVoiceToolkit-win-x64.SHA256SUMS.txt
            artifacts/WeChatVoiceToolkit-win-x64.sbom.spdx.json
            artifacts/WeChatVoiceToolkit-win-x64.package-manifest.json
            artifacts/WeChatVoiceToolkit-win-x64.update-manifest.json
            artifacts/WeChatVoiceToolkit.appinstaller
