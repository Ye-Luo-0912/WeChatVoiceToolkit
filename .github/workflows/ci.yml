name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
      - run: dotnet restore WeChatVoice.slnx --locked-mode
      - run: dotnet build WeChatVoice.slnx --configuration Release --no-restore
        env:
          CI: true
      - run: dotnet format WeChatVoice.slnx --verify-no-changes --no-restore
      - run: dotnet test WeChatVoice.slnx --configuration Release --no-build
